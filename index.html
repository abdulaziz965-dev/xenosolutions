<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--seo-start-->
    <!-- Replaced for every page at build time by scripts/prerender.mjs (title, description, canonical, languages, share preview, business details). -->
    <title>Xenosys Solutions | Website design in Doha, Qatar</title>
    <meta name="description" content="Professional websites for small businesses in Qatar. Startup Support Package: a complete website with hosting and subdomain for 1 year, QR 99. Chat with us on WhatsApp." />
    <!--seo-end-->
    <meta name="theme-color" content="#8A1538" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One font per script. Browsers only download the files for scripts actually shown on the page. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Malayalam:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" />
    <script>
      // Returning visitors: open their saved language straight away, before the page draws (no flash of English).
      try {
        var saved = localStorage.getItem('xenosys-lang')
        if (location.pathname === '/' && /^(ar|hi|ur|ml|bn|ne)$/.test(saved || '')) {
          location.replace('/' + saved + location.search + location.hash)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
